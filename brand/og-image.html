<!doctype html>
<!-- Source for public/og-image.png (the social share banner). Regenerate with: sh brand/render.sh -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 78% 50%, rgba(31, 138, 80, 0.55), transparent 55%),
      radial-gradient(circle at 0% 100%, rgba(2, 44, 22, 0.8), transparent 50%),
      linear-gradient(135deg, #005A2C 0%, #004D25 60%, #022C16 100%);
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
    mask-image: linear-gradient(90deg, transparent 30%, #000 75%);
  }
  .content { position: absolute; left: 80px; top: 72px; bottom: 72px; width: 640px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 56px; height: 56px; border-radius: 13px; box-shadow: 0 0 0 1px rgba(255,255,255,0.15); }
  .brand .name { font-size: 28px; font-weight: 800; letter-spacing: 0.02em; }
  .brand .sep { width: 1px; height: 28px; background: rgba(255, 255, 255, 0.3); }
  .brand .course { font-size: 20px; font-weight: 500; color: rgba(255, 255, 255, 0.72); }
  h1 { margin: 56px 0 0; font-size: 66px; line-height: 1.06; font-weight: 800; letter-spacing: -0.025em; }
  h1 span { color: #E9B949; }
  p { margin: 24px 0 0; font-size: 25px; line-height: 1.4; font-weight: 500; color: rgba(255, 255, 255, 0.78); max-width: 580px; }
  .footer { margin-top: auto; display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 600; color: rgba(255, 255, 255, 0.85); }
  .footer .dot { width: 8px; height: 8px; border-radius: 50%; background: #E9B949; }
  .art { position: absolute; right: 40px; top: 85px; width: 460px; height: 460px; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" fill="#006C35"/><path d="M16 10.52A6.5 6.5 0 0 1 16 21.48A6.5 6.5 0 0 1 16 10.52Z" fill="#E9B949"/><g fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12.5" cy="16" r="6.5"/><circle cx="19.5" cy="16" r="6.5"/></g></svg>
      <div class="name">NESMP</div>
      <div class="sep"></div>
      <div class="course">SE423 Software Project Management</div>
    </div>
    <h1>Connecting Saudi Talent with <span>Opportunity</span></h1>
    <p>National Employment &amp; Skill Matching Platform: skill-based matching, career guidance and workforce insights.</p>
    <div class="footer"><span class="dot"></span>software-project-management.shoug-tech.com</div>
  </div>

  <svg class="art" viewBox="0 0 460 460">
    <circle cx="230" cy="230" r="220" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="3 9" />
    <path d="M230 103.51A140 140 0 0 1 230 356.49A140 140 0 0 1 230 103.51Z" fill="#E9B949" />
    <g fill="none" stroke="#fff" stroke-width="5">
      <circle cx="170" cy="230" r="140" />
      <circle cx="290" cy="230" r="140" />
    </g>
    <path d="M208 232l15 15l30-33" fill="none" stroke="#004D25" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <g font-family="Inter, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#fff" text-anchor="middle">
      <text x="100" y="237">SKILLS</text>
      <text x="360" y="237">JOBS</text>
    </g>
    <g fill="#E9B949">
      <circle cx="30" cy="230" r="7" />
      <circle cx="430" cy="230" r="7" />
    </g>
  </svg>
</body>
</html>
