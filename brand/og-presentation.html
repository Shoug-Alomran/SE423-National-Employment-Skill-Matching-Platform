<!doctype html>
<!-- Source for public/og-presentation.jpg (share banner for /presentation). Regenerate with: sh brand/render.sh -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 78% 50%, rgba(31, 138, 80, 0.55), transparent 55%),
      radial-gradient(circle at 0% 100%, rgba(2, 44, 22, 0.8), transparent 50%),
      linear-gradient(135deg, #005A2C 0%, #004D25 60%, #022C16 100%);
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
    mask-image: linear-gradient(90deg, transparent 30%, #000 75%);
  }
  .content { position: absolute; left: 80px; top: 72px; bottom: 72px; width: 620px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 56px; height: 56px; border-radius: 13px; box-shadow: 0 0 0 1px rgba(255,255,255,0.15); }
  .brand .name { font-size: 28px; font-weight: 800; letter-spacing: 0.02em; }
  .brand .sep { width: 1px; height: 28px; background: rgba(255, 255, 255, 0.3); }
  .brand .course { font-size: 20px; font-weight: 500; color: rgba(255, 255, 255, 0.72); }
  .kicker { margin-top: 52px; font-size: 20px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #8FC3A4; }
  h1 { margin: 10px 0 0; font-size: 72px; line-height: 1.04; font-weight: 800; letter-spacing: -0.025em; }
  h1 span { color: #E9B949; }
  p { margin: 22px 0 0; font-size: 25px; line-height: 1.4; font-weight: 500; color: rgba(255, 255, 255, 0.78); max-width: 580px; }
  .footer { margin-top: auto; display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 600; color: rgba(255, 255, 255, 0.85); }
  .footer .dot { width: 8px; height: 8px; border-radius: 50%; background: #E9B949; }

  /* Stacked slides illustration */
  .deck { position: absolute; right: 70px; top: 120px; width: 400px; height: 390px; }
  .slide {
    position: absolute; width: 360px; height: 203px; border-radius: 14px;
    background: #fff; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  .s3 { left: 40px; top: 0; transform: rotate(6deg); opacity: 0.35; }
  .s2 { left: 20px; top: 60px; transform: rotate(3deg); opacity: 0.6; }
  .s1 { left: 0; top: 130px; padding: 22px 24px; box-sizing: border-box; }
  .s1 .eb { width: 90px; height: 8px; border-radius: 4px; background: #1F8A50; }
  .s1 .tt { margin-top: 12px; font-size: 26px; font-weight: 800; color: #111827; letter-spacing: -0.02em; }
  .s1 .tt span { color: #006C35; }
  .s1 .row { display: flex; gap: 10px; margin-top: 16px; }
  .s1 .card { flex: 1; height: 62px; border-radius: 8px; background: #F0F7F3; border-left: 4px solid #006C35; }
  .s1 .bar { position: absolute; left: 0; top: 0; height: 5px; width: 62%; background: #5BAA7D; }
  .play {
    position: absolute; right: -6px; top: 262px; width: 76px; height: 76px; border-radius: 50%;
    background: #E9B949; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" fill="#006C35"/><path d="M16 10.52A6.5 6.5 0 0 1 16 21.48A6.5 6.5 0 0 1 16 10.52Z" fill="#E9B949"/><g fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12.5" cy="16" r="6.5"/><circle cx="19.5" cy="16" r="6.5"/></g></svg>
      <div class="name">NESMP</div>
      <div class="sep"></div>
      <div class="course">SE423 Software Project Management</div>
    </div>
    <div class="kicker">Project Presentation</div>
    <h1>Fursah: a fair <span>chance</span> at work</h1>
    <p>Artifacts 1 &amp; 2 — scope, organization, methodology decision and risk register.</p>
    <div class="footer"><span class="dot"></span>software-project-management.shoug-tech.com/presentation</div>
  </div>

  <div class="deck" aria-hidden="true">
    <div class="slide s3"></div>
    <div class="slide s2"></div>
    <div class="slide s1">
      <div class="bar"></div>
      <div class="eb"></div>
      <div class="tt">We chose <span>Scrum</span></div>
      <div class="row"><div class="card"></div><div class="card"></div><div class="card"></div></div>
    </div>
    <div class="play">
      <svg width="30" height="30" viewBox="0 0 30 30"><path d="M9 5l17 10L9 25z" fill="#004D25"/></svg>
    </div>
  </div>
</body>
</html>
